name: Daily Shayari Post

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST - Reel 1
    - cron: '30 4 * * *'  # 10:00 AM IST - Photo
    - cron: '30 8 * * *'  # 2:00 PM IST - Reel 2
    - cron: '30 17 * * *' # 11:00 PM IST - Reel 3
  workflow_dispatch:
    inputs:
      post_type:
        description: 'Post type: photo or reel'
        required: true
        default: 'photo'
        type: choice
        options:
          - photo
          - reel

jobs:
  post-shayari:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra ffmpeg
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y google-generativeai
          pip install google-genai requests pillow moviepy==1.0.3 numpy elevenlabs edge-tts asyncio openai

      - name: Restore progress
        uses: actions/cache@v4
        with:
          path: progress.json
          key: progress-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            progress-

      - name: Determine post type
        id: post_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.post_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 4 * * *" ]; then
            echo "type=photo" >> "$GITHUB_OUTPUT"
          else
            echo "type=reel" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Shayari Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          POST_TYPE: ${{ steps.post_type.outputs.type }}
          MEDIA_HOST: tempfile
          MAX_RETRIES: "2"
          RETRY_DELAY_SECONDS: "60"
        run: python -u poster.py
